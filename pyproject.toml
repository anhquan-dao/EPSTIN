[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "can-signal-parameter-generator"
version = "0.1.0"
description = "Planned CAN signal Excel-to-PAR parameter-file generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywin32>=308; platform_system == 'Windows'",
    "pyinstaller>=6.0",
]
